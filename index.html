    (settings.company_phone ? '<div style="font-size:11px;color:#888">' + settings.company_phone + '</div>' : '') +
    (settings.company_email ? '<div style="font-size:11px;color:#888">' + settings.company_email + '</div>' : '') + '</div>' +
    '<div style="text-align:right"><div style="font-size:30px;font-weight:900;letter-spacing:2px">INVOICE</div>' +

    '<div style="flex:1"><div style="font-size:10px;font-weight:800;color:#888;letter-spacing:.15em;margin-bottom:5px">CUSTOMER</div>' +
    '<div style="font-weight:700;font-size:13px">' + (wo.client_name || "") + '</div>' +
    (wo.client_address ? '<div style="font-size:12px;color:#555">' + wo.client_address + '</div>' : '') + '</div></div>' +

    '<div style="display:flex;gap:40px;margin-bottom:24px"><div style="flex:1">' +

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    // Check existing session
    supa.auth.getSession().then(({ data: { session } }) => {
      setSession(session);
      if (session) loadProfile(session.user.id);
      else setLoading(false);
    });
    // Listen for auth changes
    const { data: { subscription } } = supa.auth.onAuthStateChange((_event, session) => {
      setSession(session);
      if (session) loadProfile(session.user.id);
      else { setProfile(null); setLoading(false); }
    });
    return () => subscription.unsubscribe();
  }, []);

  const loadProfile = async (userId) => {
    const { data } = await supa.from("profiles").select("*").eq("id", userId).single();
    setProfile(data);
    setLoading(false);
  };

  if (loading) return <div style={{ background: "#0A0F1A", minHeight: "100vh" }}><Spinner msg="Starting up…" /></div>;
  if (!session) return <AuthScreen />;
  return <FieldOps session={session} profile={profile} reloadProfile={() => loadProfile(session.user.id)} />;
}

// ── AUTH SCREEN ───────────────────────────────────────────────────────────────
function AuthScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [mode, setMode] = useState("login"); // login | signup | reset

  const login = async () => {
    setLoading(true); setError("");
    const { error } = await supa.auth.signInWithPassword({ email, password });
    if (error) setError(error.message);
    setLoading(false);
  };

  const signup = async () => {
    setLoading(true); setError("");
    const { error } = await supa.auth.signUp({ email, password });
    if (error) setError(error.message);
    else setError("Check your email for a confirmation link.");
    setLoading(false);
  };

  const reset = async () => {
    setLoading(true); setError("");
    const { error } = await supa.auth.resetPasswordForEmail(email);
    if (error) setError(error.message);
    else setError("Password reset email sent.");
    setLoading(false);
  };

  return (
    <div style={{ background: "#0A0F1A", minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "32px 24px" }}>
      <div style={{ width: "100%", maxWidth: 400 }}>
        <div style={{ textAlign: "center", marginBottom: 40 }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.2em", color: "#E86900", marginBottom: 4 }}>FIELDOPS</div>
          <div style={{ fontSize: 26, fontWeight: 900, color: "#F0F6FF" }}>Desert Link Technologies</div>
          <div style={{ fontSize: 13, color: "#6B7E96", marginTop: 6 }}>Sign in to access your work orders</div>
        </div>

        {error && (
          <div style={{ background: error.includes("email") || error.includes("sent") ? "#0B2444" : "#7F1D1D", color: error.includes("email") || error.includes("sent") ? "#7EBCF5" : "#FCA5A5", padding: "12px 16px", borderRadius: 10, marginBottom: 16, fontSize: 13, fontWeight: 600 }}>
            {error}
          </div>
        )}

        <Card>
          <F label="Email" value={email} onChange={setEmail} type="email" placeholder="you@email.com" />
          {mode !== "reset" && <F label="Password" value={password} onChange={setPassword} type="password" placeholder="••••••••" />}
          {mode === "login"  && <Btn onClick={login}  disabled={loading} color="#E86900">{loading ? "Signing in…" : "Sign In"}</Btn>}
          {mode === "signup" && <Btn onClick={signup} disabled={loading} color="#E86900">{loading ? "Creating…"  : "Create Account"}</Btn>}
          {mode === "reset"  && <Btn onClick={reset}  disabled={loading} color="#1A6FC4">{loading ? "Sending…"   : "Send Reset Email"}</Btn>}
        </Card>

        <div style={{ textAlign: "center", fontSize: 13, color: "#4A5568" }}>
          {mode === "login"  && <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span onClick={() => setMode("signup")} style={{ color: "#E86900", cursor: "pointer", fontWeight: 700 }}>Create Account</span>
            <span onClick={() => setMode("reset")}  style={{ color: "#7EBCF5", cursor: "pointer" }}>Forgot password?</span>
          </div>}
          {mode === "signup" && <div style={{ textAlign: "center" }}><span onClick={() => setMode("login")} style={{ color: "#7EBCF5", cursor: "pointer" }}>Already have an account? Sign in</span></div>}
          {mode === "reset"  && <div style={{ textAlign: "center" }}><span onClick={() => setMode("login")} style={{ color: "#7EBCF5", cursor: "pointer" }}>Back to sign in</span></div>}
        </div>
      </div>
    </div>
  );
}

// ── FIELDOPS MAIN ─────────────────────────────────────────────────────────────
function FieldOps({ session, profile, reloadProfile }) {
  const [workOrders, setWorkOrders] = useState([]);
  const [settings, setSettings] = useState(null);
  const [view, setView] = useState("dashboard");
  const [activeId, setActiveId] = useState(null);
  const [filterStatus, setFilterStatus] = useState("All");
  const [toast, setToast] = useState(null);
  const [dataLoading, setDataLoading] = useState(true);

  const isAdmin = profile?.role === "admin";
  const userId  = session.user.id;
  const userEmail = session.user.email;

  const showToast = (msg, type = "success") => { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); };

  // ── Load data ──
  useEffect(() => {
    loadAll();
    // Real-time subscription
    const channel = supa.channel("fieldops-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "work_orders" }, () => loadWorkOrders())
      .subscribe();
    return () => supa.removeChannel(channel);
  }, []);

  const loadAll = async () => {
    setDataLoading(true);
    await Promise.all([loadWorkOrders(), loadSettings()]);
    setDataLoading(false);
  };

  const loadWorkOrders = async () => {
    let query = supa.from("work_orders").select("*").order("updated_at", { ascending: false });
    // Techs only see their assigned WOs
    if (profile && profile.role !== "admin") {
      query = query.contains("assigned_techs", [userEmail]);
    }
    const { data, error } = await query;
    if (!error && data) setWorkOrders(data);
  };

  const loadSettings = async () => {
    const { data } = await supa.from("settings").select("*").eq("id", 1).single();
    if (data) setSettings(data);
    else setSettings({ company_name: "Desert Link Technologies LLC", company_address: "11733 W. Chase Ln, Avondale, AZ 85323", company_phone: "", company_email: "", invoice_seq: 21 });
  };

  const saveWO = async (wo) => {
    const { line_items, time_logs, notes, ...rest } = wo;
    const payload = { ...rest, line_items: line_items || [], time_logs: time_logs || [], notes: notes || [], updated_at: new Date().toISOString() };
    if (wo.id && workOrders.find(w => w.id === wo.id)) {
      const { error } = await supa.from("work_orders").update(payload).eq("id", wo.id);
      if (error) { showToast("Save failed: " + error.message, "error"); return false; }
    } else {
      const { data, error } = await supa.from("work_orders").insert({ ...payload, created_by: userId }).select().single();
      if (error) { showToast("Save failed: " + error.message, "error"); return false; }
      if (data) { setActiveId(data.id); setWorkOrders(prev => [data, ...prev]); return data; }
    }
    await loadWorkOrders();
    return true;
  };

  const deleteWO = async (id) => {
    await supa.from("work_orders").delete().eq("id", id);
    setWorkOrders(prev => prev.filter(w => w.id !== id));
    setView("list");
    showToast("Work order deleted");
  };

  const saveSettings = async (s) => {
    await supa.from("settings").upsert({ ...s, id: 1 });
    setSettings(s);
    showToast("Settings saved");
  };

  const signOut = async () => { await supa.auth.signOut(); };
  const openWO  = (wo) => { setActiveId(wo.id); setView("detail"); };
  const activeWO = workOrders.find(w => w.id === activeId);

  const filtered = workOrders
    .filter(w => filterStatus === "All" || w.status === filterStatus)
    .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

  const stats = {
    open:       workOrders.filter(w => w.status === "Open").length,
    inProgress: workOrders.filter(w => w.status === "In Progress").length,
    completed:  workOrders.filter(w => w.status === "Completed").length,
    invoiced:   workOrders.filter(w => w.status === "Invoiced").length,
    revenue:    workOrders.filter(w => w.status === "Invoiced").reduce((s, w) => s + (w.line_items || []).reduce((si, i) => si + parseFloat(i.qty) * parseFloat(i.rate), 0), 0),
  };

  return (
    <div style={{ background: "#0A0F1A", minHeight: "100vh", color: "#E2E8F0", maxWidth: 480, margin: "0 auto", paddingBottom: 90 }}>

      {toast && <div style={{ position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)", background: toast.type === "success" ? "#065F46" : "#7F1D1D", color: "#fff", padding: "10px 20px", borderRadius: 10, zIndex: 9999, fontSize: 14, fontWeight: 600, boxShadow: "0 4px 20px rgba(0,0,0,0.5)", maxWidth: 340, textAlign: "center" }}>{toast.msg}</div>}

      {/* Header */}
      <div style={{ background: "#0D1626", borderBottom: "1px solid #1E2D45", padding: "16px 20px 12px", position: "sticky", top: 0, zIndex: 100 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.15em", color: "#E86900" }}>FIELDOPS {isAdmin && "· ADMIN"}</div>
            <div style={{ fontSize: 17, fontWeight: 800, color: "#F0F6FF" }}>{settings?.company_name || "Desert Link"}</div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={loadAll} style={{ background: "none", border: "none", color: "#4A8FC1", fontSize: 20, cursor: "pointer", padding: 4 }}>↻</button>
            {isAdmin && <button onClick={() => setView("settings")} style={{ background: "none", border: "none", color: "#4A8FC1", fontSize: 22, cursor: "pointer", padding: 4 }}>⚙</button>}
            <button onClick={signOut} style={{ background: "none", border: "none", color: "#4A5568", fontSize: 13, cursor: "pointer", padding: 4, fontWeight: 600 }}>Out</button>
          </div>
        </div>
        <div style={{ fontSize: 10, color: "#2D5A8A", marginTop: 3 }}>

// ── Dashboard ─────────────────────────────────────────────────────────────────

// ── New WO (admin only) ───────────────────────────────────────────────────────
function NewWO({ settings, saveWO, setView, setActiveId, showToast }) {
  const WORK_TYPES = ["Structured Cabling", "Network Infrastructure", "IP Camera / CCTV", "Access Control", "Managed IT Services", "Rack & Stack", "Fiber Optic", "Wireless AP Deployment", "Server Room Build-Out", "Alarm System"];
  const [form, setForm] = useState({ client_name: "", client_address: "", client_phone: "", client_email: "", location: "", customer_po: "", project: "", work_type: WORK_TYPES[0], description: "", assigned_techs: [], scheduled_date: todayStr(), priority: "Normal", status: "Open", line_items: [], time_logs: [], notes: [], invoice_notes: "" });
  const [techInput, setTechInput] = useState("");
  const set = (k, v) => setForm(p => ({ ...p, [k]: v }));
  const addTech = () => { const t = techInput.trim(); if (!t) return; set("assigned_techs", [...form.assigned_techs, t]); setTechInput(""); };
  const rmTech = (t) => set("assigned_techs", form.assigned_techs.filter(x => x !== t));

  const submit = async () => {
    if (!form.client_name.trim()) { showToast("Client name required", "error"); return; }
    if (!form.location.trim())    { showToast("Service address required", "error"); return; }
    const wo_number = Date.now().toString().slice(-6);
    const result = await saveWO({ ...form, wo_number });
    if (result) { setView("detail"); showToast("Work order created"); }
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <button onClick={() => setView("dashboard")} style={{ background: "none", border: "none", color: "#4A8FC1", fontSize: 22, cursor: "pointer" }}>←</button>
        <div style={{ fontSize: 18, fontWeight: 800 }}>New Work Order</div>
      </div>
      <Card><SL>CLIENT INFO</SL>
        <F label="Client / Company Name *" value={form.client_name} onChange={v => set("client_name", v)} placeholder="e.g. Super Star Car Wash" />
        <F label="Billing Address" value={form.client_address} onChange={v => set("client_address", v)} placeholder="960 W. Behrend Dr. Ste 1, Phoenix AZ" />
        <F label="Phone" value={form.client_phone} onChange={v => set("client_phone", v)} type="tel" />
        <F label="Email" value={form.client_email} onChange={v => set("client_email", v)} type="email" />
      </Card>
      <Card><SL>JOB DETAILS</SL>
        <F label="Service Address *" value={form.location} onChange={v => set("location", v)} placeholder="1625 W Bell Rd, Phoenix AZ 85023" />
        <F label="Customer PO" value={form.customer_po} onChange={v => set("customer_po", v)} placeholder="e.g. SUPRAZ-AMO52126" />
        <F label="Project" value={form.project} onChange={v => set("project", v)} placeholder="e.g. Store 2019 - CarPic Camera" />
        <Sel label="Work Type" value={form.work_type} options={WORK_TYPES} onChange={v => set("work_type", v)} />
        <Sel label="Priority" value={form.priority} options={["Low", "Normal", "High", "Emergency"]} onChange={v => set("priority", v)} />
        <F label="Scheduled Date" value={form.scheduled_date} onChange={v => set("scheduled_date", v)} type="date" />
        <TA label="Scope of Work" value={form.description} onChange={v => set("description", v)} placeholder="Describe the work to be performed…" />
      </Card>
      <Card><SL>ASSIGN TECHNICIANS (enter email addresses)</SL>
        {form.assigned_techs.map(t => (
          <div key={t} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #1A2333" }}>
            <span style={{ fontSize: 13, color: "#C2D3E8" }}>{t}</span>
            <button onClick={() => rmTech(t)} style={{ background: "none", border: "none", color: "#4A5568", cursor: "pointer", fontSize: 20 }}>×</button>
          </div>
        ))}
        <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
          <input value={techInput} onChange={e => setTechInput(e.target.value)} placeholder="tech@email.com" onKeyDown={e => e.key === "Enter" && addTech()} style={{ flex: 1, ...INP }} autoCapitalize="none" />
          <button onClick={addTech} style={{ padding: "0 16px", background: "#E86900", border: "none", borderRadius: 10, color: "#fff", fontWeight: 800, cursor: "pointer" }}>+</button>
        </div>
      </Card>
      <Btn onClick={submit} color="#E86900">Create Work Order</Btn>
    </div>
  );
}

// ── WO Detail ─────────────────────────────────────────────────────────────────
function WODetail({ wo, settings, saveWO, deleteWO, setView, showToast, isAdmin, userId }) {
  const [tab, setTab] = useState("overview");
  const [local, setLocal] = useState(wo);
  useEffect(() => setLocal(wo), [wo.id, wo.updated_at]);

  const persist = async (patch) => {
    const updated = { ...local, ...patch };
    setLocal(updated);
    await saveWO(updated);
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
        <button onClick={() => setView("list")} style={{ background: "none", border: "none", color: "#4A8FC1", fontSize: 22, cursor: "pointer" }}>←</button>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 11, color: "#E86900", fontWeight: 700 }}>WO-{local.wo_number || local.id?.slice(0,8)}</div>
          <div style={{ fontSize: 17, fontWeight: 800 }}>{local.client_name}</div>
          {local.project && <div style={{ fontSize: 12, color: "#E86900", fontWeight: 600 }}>{local.project}</div>}
        </div>
        <Badge status={local.status} />
      </div>

      {/* Status — techs can update status */}
      <div style={{ display: "flex", gap: 8, marginBottom: 16, overflowX: "auto" }}>
        {["Open", "In Progress", "On Hold", "Completed"].map(s => (
          <button key={s} onClick={() => persist({ status: s })} style={{ background: local.status === s ? "#E86900" : "#111827", border: local.status === s ? "none" : "1px solid #1E2D45", color: local.status === s ? "#fff" : "#6B7E96", borderRadius: 20, padding: "5px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0 }}>{s}</button>
        ))}
      </div>

      <div style={{ display: "flex", borderBottom: "1px solid #1E2D45", marginBottom: 16, overflowX: "auto" }}>
        {["overview", "time", ...(isAdmin ? ["billing"] : []), "notes"].map(t => (
          <button key={t} onClick={() => setTab(t)} style={{ background: "none", border: "none", borderBottom: tab === t ? "2px solid #E86900" : "2px solid transparent", color: tab === t ? "#FFA040" : "#4A5568", padding: "8px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", textTransform: "capitalize", whiteSpace: "nowrap", flexShrink: 0 }}>{t}</button>
        ))}
      </div>

      {tab === "overview" && <OverviewTab wo={local} persist={persist} showToast={showToast} deleteWO={deleteWO} isAdmin={isAdmin} />}
      {tab === "time"     && <TimeTab wo={local} persist={persist} showToast={showToast} userId={userId} userEmail={local.assigned_techs?.[0] || ""} />}
      {tab === "billing"  && isAdmin && <BillingTab wo={local} persist={persist} showToast={showToast} onInvoice={() => setView("invoice")} />}
      {tab === "notes"    && <NotesTab wo={local} persist={persist} showToast={showToast} />}
    </div>
  );
}

      <F label="Email" value={form.client_email} onChange={v => set("client_email", v)} />

            <span style={{ fontSize: 13, color: "#C2D3E8", fontWeight: 600, textAlign: "right" }}>{v}</span>

        <button onClick={() => { if (window.confirm("Delete this work order?")) deleteWO(wo.id); }} style={{ width: "100%", padding: 12, background: "none", border: "1px solid #7F1D1D", borderRadius: 10, color: "#FCA5A5", fontWeight: 700, fontSize: 13, cursor: "pointer", marginBottom: 10 }}>🗑 Delete Work Order</button>
      </>}
    </div>
  );
}

function TimeTab({ wo, persist, showToast }) {
  const [techName, setTechName] = useState("");
  const [hours, setHours] = useState("");
  const [note, setNote] = useState("");
  const [date, setDate] = useState(todayStr());
  const [clockIn, setClockIn] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const timer = useRef(null);

  useEffect(() => {
    if (clockIn) { timer.current = setInterval(() => setElapsed(Date.now() - clockIn), 1000); }
    else { clearInterval(timer.current); }
    return () => clearInterval(timer.current);
  }, [clockIn]);

  const fmtE = (ms) => { const s = Math.floor(ms / 1000); return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor((s%3600)/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
  const stopClock = async () => { const h = parseFloat(((Date.now()-clockIn)/3600000).toFixed(2)); await persist({ time_logs: [...(wo.time_logs||[]), {id:uid(),tech:techName||"Me",hours:h,note:"Clock in/out",date}] }); setClockIn(null); showToast(h+"h logged"); };
  const addManual = async () => { if (!hours||isNaN(hours)||parseFloat(hours)<=0) { showToast("Enter valid hours","error"); return; } await persist({ time_logs: [...(wo.time_logs||[]), {id:uid(),tech:techName||"Me",hours:parseFloat(hours),note,date}] }); setHours(""); setNote(""); showToast(hours+"h logged"); };
  const remove = async (id) => persist({ time_logs: (wo.time_logs||[]).filter(l=>l.id!==id) });
  const total = (wo.time_logs||[]).reduce((s,l)=>s+parseFloat(l.hours||0),0);

  return (
    <div>
      <Card style={{ background: clockIn ? "#0B2444" : "#111827", border: clockIn ? "1px solid #1A4A7A" : "1px solid #1E2D45", textAlign: "center" }}>
        <SL>STOPWATCH</SL>
        {clockIn ? <div style={{ fontSize: 36, fontWeight: 800, color: "#7EBCF5", marginBottom: 12, fontVariantNumeric: "tabular-nums", letterSpacing: 2 }}>{fmtE(elapsed)}</div>
                 : <div style={{ fontSize: 13, color: "#4A5568", marginBottom: 12 }}>Tap Clock In to start tracking time</div>}
        <F label="Your Name" value={techName} onChange={setTechName} placeholder="Your name" />
        <button onClick={clockIn ? stopClock : ()=>setClockIn(Date.now())} style={{ width:"100%",padding:14,borderRadius:10,border:"none",fontWeight:800,fontSize:15,cursor:"pointer",background:clockIn?"#7F1D1D":"#065F46",color:clockIn?"#FCA5A5":"#6EE7B7",marginTop:8 }}>
          {clockIn ? "⏹ Clock Out & Save" : "⏱ Clock In"}
        </button>
      </Card>
      <Card><SL>MANUAL ENTRY</SL>
        <F label="Your Name" value={techName} onChange={setTechName} placeholder="Your name" />
        <F label="Hours" value={hours} onChange={setHours} placeholder="e.g. 2.5" type="number" />
        <F label="Date" value={date} onChange={setDate} type="date" />
        <F label="Notes" value={note} onChange={setNote} placeholder="What was done?" />
        <Btn onClick={addManual} color="#E86900">Add Time Entry</Btn>
      </Card>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#E86900", marginBottom: 10 }}>LOG · TOTAL: {total.toFixed(2)}h</div>
      {(wo.time_logs||[]).length===0 && <div style={{ textAlign:"center",color:"#4A5568",fontSize:13,padding:20 }}>No time logged yet</div>}
      {[...(wo.time_logs||[])].reverse().map(log => (
        <div key={log.id} style={{ background:"#111827",borderRadius:10,padding:"12px 14px",marginBottom:8,border:"1px solid #1E2D45",display:"flex",justifyContent:"space-between",alignItems:"center" }}>
          <div>
            <div style={{ fontWeight:700,fontSize:14 }}>{log.tech} · <span style={{ color:"#FFA040" }}>{log.hours}h</span></div>
            <div style={{ fontSize:12,color:"#4A5568" }}>{fmtDate(log.date)}{log.note?" · "+log.note:""}</div>
          </div>
          <button onClick={()=>remove(log.id)} style={{ background:"none",border:"none",color:"#4A5568",cursor:"pointer",fontSize:22 }}>×</button>
        </div>
      ))}
    </div>
  );
}

function BillingTab({ wo, persist, showToast, onInvoice }) {
  const [desc, setDesc] = useState(""); const [qty, setQty] = useState("1"); const [rate, setRate] = useState("");
  const add = async () => { if (!desc.trim()||!rate||isNaN(rate)) { showToast("Fill in description and rate","error"); return; } await persist({ line_items:[...(wo.line_items||[]),{id:uid(),desc,qty:parseFloat(qty),rate:parseFloat(rate)}] }); setDesc(""); setQty("1"); setRate(""); showToast("Line item added"); };
  const remove = async (id) => persist({ line_items:(wo.line_items||[]).filter(i=>i.id!==id) });
  const sub = (wo.line_items||[]).reduce((s,i)=>s+parseFloat(i.qty)*parseFloat(i.rate),0);
  const hours = (wo.time_logs||[]).reduce((s,l)=>s+parseFloat(l.hours||0),0);
  return (
    <div>
      <Card><SL>ADD LINE ITEM</SL>
        <F label="Description" value={desc} onChange={setDesc} placeholder="e.g. Dispatch Fee, Labor" />
        <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
          <F label="Qty" value={qty} onChange={setQty} type="number" />
          <F label="Unit Price ($)" value={rate} onChange={setRate} type="number" placeholder="0.00" />
        </div>
        <Btn onClick={add} color="#E86900">+ Add Item</Btn>
      </Card>
      {(wo.line_items||[]).map(item => (
        <div key={item.id} style={{ background:"#111827",borderRadius:10,padding:"12px 14px",marginBottom:8,border:"1px solid #1E2D45",display:"flex",justifyContent:"space-between",alignItems:"center" }}>
          <div><div style={{ fontWeight:700,fontSize:14 }}>{item.desc}</div><div style={{ fontSize:12,color:"#4A5568" }}>{item.qty} × {fmt$(item.rate)}</div></div>
          <div style={{ display:"flex",alignItems:"center",gap:10 }}>
            <span style={{ color:"#FFA040",fontWeight:700 }}>{fmt$(item.qty*item.rate)}</span>
            <button onClick={()=>remove(item.id)} style={{ background:"none",border:"none",color:"#4A5568",cursor:"pointer",fontSize:22 }}>×</button>
          </div>
        </div>
      ))}
      <Card><SL>SUMMARY</SL>
        <div style={{ display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #1A2333" }}><span style={{ fontSize:13,color:"#6B7E96" }}>Time Logged</span><span style={{ fontSize:13,color:"#C2D3E8",fontWeight:600 }}>{hours.toFixed(2)} hrs</span></div>
        <div style={{ display:"flex",justifyContent:"space-between",paddingTop:10 }}><span style={{ fontWeight:800,fontSize:16 }}>Sub Total</span><span style={{ fontWeight:800,fontSize:18,color:"#FFA040" }}>{fmt$(sub)}</span></div>
      </Card>
      <Btn onClick={onInvoice} color="#065F46">📄 Generate Invoice</Btn>
    </div>
  );
}

function NotesTab({ wo, persist, showToast }) {
  const [note, setNote] = useState("");
  const add = async () => { if (!note.trim()) return; await persist({ notes:[...(wo.notes||[]),{id:uid(),text:note.trim(),timestamp:new Date().toISOString()}] }); setNote(""); showToast("Note saved"); };
  const remove = async (id) => persist({ notes:(wo.notes||[]).filter(n=>n.id!==id) });
  return (
    <div>
      <TA label="Add a note" value={note} onChange={setNote} placeholder="Site conditions, client requests, follow-up items…" rows={4} />
      <Btn onClick={add} color="#E86900">Save Note</Btn>
      {(wo.notes||[]).length===0 && <div style={{ textAlign:"center",color:"#4A5568",fontSize:13,padding:20 }}>No notes yet</div>}
      {[...(wo.notes||[])].reverse().map(n => (
        <div key={n.id} style={{ background:"#111827",borderRadius:10,padding:"12px 14px",marginBottom:8,border:"1px solid #1E2D45" }}>
          <div style={{ display:"flex",justifyContent:"space-between",gap:8 }}>
            <div style={{ fontSize:13,color:"#C2D3E8",lineHeight:1.6,flex:1 }}>{n.text}</div>
            <button onClick={()=>remove(n.id)} style={{ background:"none",border:"none",color:"#4A5568",cursor:"pointer",fontSize:22,flexShrink:0 }}>×</button>
          </div>
          <div style={{ fontSize:11,color:"#4A5568",marginTop:6 }}>{new Date(n.timestamp).toLocaleString()}</div>
        </div>
      ))}
    </div>
  );
}

function InvoiceView({ wo, settings, saveWO, saveSettings, setView, showToast }) {
  const seq = (settings?.invoice_seq || 21) + 1;
  const invNum = "INV-" + new Date().getFullYear() + "-" + String(seq).padStart(3,"0");
  const [invoiceNotes, setInvoiceNotes] = useState(wo.invoice_notes || "");
  const items = wo.line_items || [];
  const sub = items.reduce((s,i)=>s+parseFloat(i.qty)*parseFloat(i.rate),0);

  const markInvoiced = async () => {
    await saveWO({ ...wo, status: "Invoiced", invoice_notes: invoiceNotes });
    await saveSettings({ ...settings, invoice_seq: seq });
    showToast("Marked as Invoiced · " + invNum);
    setView("list");
  };

  const printInvoice = () => {
    const html = buildInvoiceHTML({ ...wo, invoice_notes: invoiceNotes }, settings, invNum);
    const w = window.open("", "_blank");
    if (w) { w.document.write(html); w.document.close(); setTimeout(() => w.print(), 500); }
    else showToast("Allow popups then try again", "error");
  };

  return (
    <div>
      <div style={{ display:"flex",alignItems:"center",gap:10,marginBottom:20 }}>
        <button onClick={() => setView("detail")} style={{ background:"none",border:"none",color:"#4A8FC1",fontSize:22,cursor:"pointer" }}>←</button>
        <div style={{ fontSize:18,fontWeight:800 }}>Invoice</div>
        <div style={{ marginLeft:"auto",fontSize:12,color:"#E86900",fontWeight:700 }}>{invNum}</div>
      </div>
      <Card><SL>INVOICE NOTES</SL>
        <TA value={invoiceNotes} onChange={setInvoiceNotes} placeholder="Describe the work performed…" rows={4} />
      </Card>
      <div style={{ background:"#fff",borderRadius:14,overflow:"hidden",boxShadow:"0 4px 30px rgba(0,0,0,0.4)",marginBottom:16,color:"#222" }}>
        <div style={{ background:"#1a1a1a",height:10 }} />
        <div style={{ padding:"20px 18px" }}>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18 }}>
            <div><div style={{ fontSize:18,fontWeight:900,color:"#1a1a1a" }}>DESERT LINK</div><div style={{ fontSize:9,fontWeight:700,color:"#888",letterSpacing:3 }}>TECHNOLOGIES</div>{settings?.company_address&&<div style={{ fontSize:10,color:"#888",marginTop:5 }}>{settings.company_address}</div>}</div>
            <div style={{ textAlign:"right" }}><div style={{ fontSize:20,fontWeight:900,letterSpacing:2 }}>INVOICE</div><div style={{ width:40,height:3,background:"#E86900",marginTop:4,marginLeft:"auto" }} /><div style={{ fontSize:11,color:"#666",marginTop:4 }}>{invNum}</div></div>
          </div>
          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14,fontSize:11 }}>
            <div><div style={{ fontSize:9,fontWeight:800,color:"#888",letterSpacing:"0.12em",marginBottom:3 }}>CUSTOMER</div><div style={{ fontWeight:700 }}>{wo.client_name}</div>{wo.client_address&&<div style={{ color:"#555" }}>{wo.client_address}</div>}</div>
            <div>{wo.customer_po&&<div style={{ marginBottom:5 }}><div style={{ fontSize:9,fontWeight:800,color:"#888",letterSpacing:"0.12em",marginBottom:2 }}>CUSTOMER PO</div><div style={{ fontWeight:700 }}>{wo.customer_po}</div></div>}{wo.project&&<div style={{ marginBottom:5 }}><div style={{ fontSize:9,fontWeight:800,color:"#888",letterSpacing:"0.12em",marginBottom:2 }}>PROJECT</div><div style={{ fontWeight:700 }}>{wo.project}</div></div>}</div>
          </div>
          {wo.location&&<div style={{ marginBottom:12,fontSize:11 }}><div style={{ fontSize:9,fontWeight:800,color:"#888",letterSpacing:"0.12em",marginBottom:3 }}>SERVICE ADDRESS</div><div>{wo.location}</div></div>}
          <table style={{ width:"100%",borderCollapse:"collapse",marginBottom:0,fontSize:11 }}>
            <thead><tr style={{ background:"#2a2a2a",color:"#fff" }}><th style={{ padding:"8px 10px",textAlign:"left" }}>Description</th><th style={{ padding:"8px 10px",textAlign:"center" }}>Qty</th><th style={{ padding:"8px 10px",textAlign:"right" }}>Price</th><th style={{ padding:"8px 10px",textAlign:"right",background:"#E86900" }}>Total</th></tr></thead>
            <tbody>
              {items.length===0&&<tr><td colSpan={4} style={{ padding:12,textAlign:"center",color:"#aaa" }}>No line items</td></tr>}
              {items.map((item,i)=><tr key={item.id} style={{ background:i%2===0?"#fff":"#fafafa" }}><td style={{ padding:"7px 10px" }}>{item.desc}</td><td style={{ padding:"7px 10px",textAlign:"center",color:"#555" }}>{item.qty}</td><td style={{ padding:"7px 10px",textAlign:"right",color:"#555" }}>{fmt$(item.rate)}</td><td style={{ padding:"7px 10px",textAlign:"right",fontWeight:700,background:"#E8690015" }}>{fmt$(item.qty*item.rate)}</td></tr>)}
            </tbody>
          </table>
          <div style={{ display:"flex",justifyContent:"flex-end",marginBottom:12 }}><div style={{ background:"#2a2a2a",color:"#fff",padding:"8px 14px",fontWeight:800,fontSize:12 }}>Sub Total</div><div style={{ background:"#E86900",color:"#fff",padding:"8px 14px",fontWeight:800,fontSize:12,minWidth:70,textAlign:"right" }}>{fmt$(sub)}</div></div>
          {invoiceNotes&&<div style={{ background:"#f5f5f5",borderLeft:"3px solid #2a2a2a",padding:"10px 12px" }}><div style={{ fontSize:9,fontWeight:800,color:"#333",letterSpacing:"0.12em",marginBottom:5 }}>INVOICE NOTES</div><div style={{ fontSize:11,color:"#444",lineHeight:1.6 }}>{invoiceNotes}</div></div>}
        </div>
        <div style={{ background:"#E86900",height:8 }} />
      </div>
      <Btn onClick={printInvoice} color="#1A6FC4">🖨 Print / Save as PDF</Btn>
      <Btn onClick={markInvoiced} color="#065F46">✓ Mark as Invoiced</Btn>
    </div>
  );
}

function SettingsView({ settings, saveSettings, setView, session }) {
  const [form, setForm] = useState({ ...settings });
  const set = (k, v) => setForm(p => ({ ...p, [k]: v }));
  return (
    <div>
      <div style={{ display:"flex",alignItems:"center",gap:12,marginBottom:20 }}>
        <button onClick={() => setView("dashboard")} style={{ background:"none",border:"none",color:"#4A8FC1",fontSize:22,cursor:"pointer" }}>←</button>
        <div style={{ fontSize:18,fontWeight:800 }}>Settings</div>
      </div>
      <Card style={{ background:"#0B2444",border:"1px solid #1A3A5C" }}><SL>ACCOUNT</SL>
        <div style={{ fontSize:13,color:"#C2D3E8",marginBottom:12 }}>Signed in as <b>{session.user.email}</b></div>
        <div style={{ fontSize:11,color:"#4A5568",marginBottom:12 }}>Role: Admin · All data syncs via Supabase in real-time</div>
      </Card>
      <Card><SL>COMPANY INFO</SL>
        <F label="Company Name" value={form.company_name} onChange={v => set("company_name", v)} />
        <F label="Address" value={form.company_address} onChange={v => set("company_address", v)} />
        <F label="Phone" value={form.company_phone} onChange={v => set("company_phone", v)} type="tel" />
        <F label="Email" value={form.company_email} onChange={v => set("company_email", v)} type="email" />
        <F label="Last Invoice # (next will be +1)" value={String(form.invoice_seq || 21)} onChange={v => set("invoice_seq", parseInt(v) || 21)} type="number" />
        <Btn onClick={() => saveSettings(form)} color="#E86900">Save Settings</Btn>
      </Card>
    </div>
  );
}

// Register service worker
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
