<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FieldOps" />
  <meta name="theme-color" content="#E86900" />
  <title>FieldOps – Desert Link</title>
  <link rel="manifest" href="manifest.json" />
  <!-- iOS home screen icons (generated inline as SVG → PNG via canvas) -->
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body, #root {
      margin: 0; padding: 0; height: 100%;
      background: #0A0F1A;
      font-family: -apple-system, 'Inter', system-ui, sans-serif;
      overscroll-behavior: none;
    }
    /* Safe area insets for iPhone notch/home bar */
    #root {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Smooth scrolling */
    .scroll-view { -webkit-overflow-scrolling: touch; overflow-y: auto; }
    /* Remove iOS input styling */
    input, select, textarea, button {
      -webkit-appearance: none;
      font-family: inherit;
    }
    /* Prevent zoom on input focus */
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel via CDN (no build step) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Storage ───────────────────────────────────────────────────────────────────
const STORE_KEY = "desertlink_fieldops_v2";
function loadStore() {
  try { const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; } catch { return null; }
}
function saveStore(data) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e) { console.warn("Storage full", e); }
}
function freshStore() {
  return {
    workOrders: [],
    nextId: 1022,
    settings: {
      companyName: "Desert Link Technologies LLC",
      companyAddress: "11733 W. Chase Ln, Avondale, AZ 85323",
      companyPhone: "",
      companyEmail: "",
      invoiceSeq: 21,
      techs: ["Uriel", "Marcus", "Dani", "Kyle"],
      workTypes: ["Structured Cabling", "Network Infrastructure", "IP Camera / CCTV", "Access Control", "Managed IT Services", "Rack & Stack", "Fiber Optic", "Wireless AP Deployment", "Server Room Build-Out", "Alarm System"],
    },
  };
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt$ = (n) => "$" + parseFloat(n || 0).toFixed(2);
const fmtDate = (d) => d ? new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "—";
const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => new Date().toISOString().slice(0, 10);

const STATUS_COLORS = {
  "Open":        { bg: "#1E3A5F", fg: "#7EBCF5" },
  "In Progress": { bg: "#1A3A2A", fg: "#4ADE80" },
  "On Hold":     { bg: "#3A2A00", fg: "#FBBF24" },
  "Completed":   { bg: "#1A1A2E", fg: "#A78BFA" },
  "Invoiced":    { bg: "#0F2A1A", fg: "#34D399" },
};
function Badge({ status }) {
  const c = STATUS_COLORS[status] || { bg: "#1E1E1E", fg: "#aaa" };
  return React.createElement("span", { style: { background: c.bg, color: c.fg, borderRadius: 6, padding: "2px 10px", fontSize: 11, fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", whiteSpace: "nowrap" } }, status);
}

// ── UI Atoms ──────────────────────────────────────────────────────────────────
const INP = { width: "100%", padding: "12px 13px", background: "#0D1626", border: "1px solid #1E2D45", borderRadius: 10, color: "#E2E8F0", fontSize: 16, outline: "none", boxSizing: "border-box" };

function F({ label, value, onChange, placeholder = "", type = "text" }) {
  return (
    <div style={{ marginBottom: 12 }}>
      {label && <div style={{ fontSize: 11, fontWeight: 700, color: "#6B7E96", marginBottom: 5, letterSpacing: "0.06em" }}>{label.toUpperCase()}</div>}
      <input type={type} value={value || ""} onChange={e => onChange(e.target.value)} placeholder={placeholder} style={INP}
        inputMode={type === "number" ? "decimal" : type === "tel" ? "tel" : type === "email" ? "email" : "text"} />
    </div>
  );
}
function Sel({ label, value, options, onChange }) {
  return (
    <div style={{ marginBottom: 12 }}>
      {label && <div style={{ fontSize: 11, fontWeight: 700, color: "#6B7E96", marginBottom: 5, letterSpacing: "0.06em" }}>{label.toUpperCase()}</div>}
      <select value={value || ""} onChange={e => onChange(e.target.value)} style={{ ...INP, appearance: "none" }}>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </div>
  );
}
function TA({ label, value, onChange, placeholder = "", rows = 3 }) {
  return (
    <div style={{ marginBottom: 12 }}>
      {label && <div style={{ fontSize: 11, fontWeight: 700, color: "#6B7E96", marginBottom: 5, letterSpacing: "0.06em" }}>{label.toUpperCase()}</div>}
      <textarea value={value || ""} onChange={e => onChange(e.target.value)} placeholder={placeholder} rows={rows} style={{ ...INP, resize: "vertical", lineHeight: 1.5 }} />
    </div>
  );
}
function Card({ children, style = {} }) {
  return <div style={{ background: "#111827", borderRadius: 12, padding: 16, marginBottom: 14, border: "1px solid #1E2D45", ...style }}>{children}</div>;
}
function SL({ children }) {
  return <div style={{ fontSize: 11, fontWeight: 700, color: "#4A8FC1", letterSpacing: "0.1em", marginBottom: 10 }}>{children}</div>;
}
function Btn({ onClick, children, color = "#1A6FC4", disabled = false, style = {} }) {
  return <button onClick={onClick} disabled={disabled} style={{ width: "100%", padding: 14, background: disabled ? "#1A2333" : color, border: "none", borderRadius: 12, color: disabled ? "#4A5568" : "#fff", fontWeight: 800, fontSize: 15, cursor: disabled ? "not-allowed" : "pointer", marginBottom: 10, ...style }}>{children}</button>;
}
function Ghost({ onClick, children }) {
  return <button onClick={onClick} style={{ width: "100%", padding: 12, background: "#1A2333", border: "1px solid #1E2D45", borderRadius: 10, color: "#7EBCF5", fontWeight: 700, fontSize: 13, cursor: "pointer", marginBottom: 10 }}>{children}</button>;
}

// ── Invoice HTML ──────────────────────────────────────────────────────────────
function buildInvoiceHTML(wo, settings, invNum) {
  const items = wo.lineItems || [];
  const sub = items.reduce((s, i) => s + parseFloat(i.qty) * parseFloat(i.rate), 0);
  const invDate = new Date().toLocaleDateString("en-US", { month: "2-digit", day: "2-digit", year: "numeric" });
  const dueDate = new Date(Date.now() + 30 * 86400000).toLocaleDateString("en-US", { month: "2-digit", day: "2-digit", year: "numeric" });
  const rows = items.map((item, i) =>
    '<tr style="background:' + (i % 2 === 0 ? "#fff" : "#fafafa") + '">' +
    '<td style="padding:10px 16px;font-size:13px">' + item.desc + '</td>' +
    '<td style="padding:10px 16px;text-align:center;font-size:13px">' + item.qty + '</td>' +
    '<td style="padding:10px 16px;text-align:right;font-size:13px">$' + parseFloat(item.rate).toFixed(2) + '</td>' +
    '<td style="padding:10px 16px;text-align:right;font-size:13px;font-weight:600;background:#E8690018">$' + (parseFloat(item.qty) * parseFloat(item.rate)).toFixed(2) + '</td>' +
    '</tr>'
  ).join("");

  return '<!DOCTYPE html><html><body style="font-family:Arial,sans-serif;color:#222;max-width:700px;margin:0 auto;padding:0">' +
  '<div style="background:#1a1a1a;height:12px"></div>' +
  '<div style="padding:32px 40px">' +
  '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px">' +
    '<div>' +
      '<div style="font-size:26px;font-weight:900;color:#1a1a1a">DESERT LINK</div>' +
      '<div style="font-size:11px;font-weight:700;color:#888;letter-spacing:3px">TECHNOLOGIES</div>' +
      (settings.companyAddress ? '<div style="font-size:11px;color:#888;margin-top:8px">' + settings.companyAddress + '</div>' : '') +
      (settings.companyPhone ? '<div style="font-size:11px;color:#888">' + settings.companyPhone + '</div>' : '') +
      (settings.companyEmail ? '<div style="font-size:11px;color:#888">' + settings.companyEmail + '</div>' : '') +
    '</div>' +
    '<div style="text-align:right">' +
      '<div style="font-size:30px;font-weight:900;letter-spacing:2px">INVOICE</div>' +
      '<div style="width:60px;height:4px;background:#E86900;margin:6px 0 0 auto"></div>' +
    '</div>' +
  '</div>' +
  '<div style="display:flex;gap:40px;margin-bottom:24px">' +
    '<div style="flex:1">' +
      '<div style="font-size:10px;font-weight:800;color:#888;letter-spacing:.15em;margin-bottom:5px">REMITTANCE ADDRESS</div>' +
      '<div style="font-weight:700;font-size:13px">Desert Link Technologies LLC</div>' +
      (settings.companyAddress ? '<div style="font-size:12px;color:#555">' + settings.companyAddress + '</div>' : '') +
    '</div>' +
    '<div style="flex:1">' +
      '<div style="font-size:10px;font-weight:800;color:#888;letter-spacing:.15em;margin-bottom:5px">CUSTOMER</div>' +
      '<div style="font-weight:700;font-size:13px">' + (wo.clientName || "") + '</div>' +
      (wo.clientAddress ? '<div style="font-size:12px;color:#555">' + wo.clientAddress + '</div>' : '') +
    '</div>' +
  '</div>' +
  (wo.location ? '<div style="margin-bottom:20px"><div style="font-size:10px;font-weight:800;color:#888;letter-spacing:.15em;margin-bottom:5px">SERVICE ADDRESS</div><div style="font-size:13px">' + wo.location + '</div></div>' : '') +
  '<div style="display:flex;gap:40px;margin-bottom:24px">' +
    '<div style="flex:1">' +
      (wo.customerPO ? '<div style="margin-bottom:10px"><div style="font-size:10px;font-weight:800;color:#888;letter-spacing:.15em;margin-bottom:3px">CUSTOMER PO</div><div style="font-weight:700;font-size:13px">' + wo.customerPO + '</div></div>' : '') +
      (wo.project ? '<div><div style="font-size:10px;font-weight:800;color:#888;letter-spacing:.15em;margin-bottom:3px">PROJECT</div><div style="font-weight:700;font-size:13px">' + wo.project + '</div></div>' : '') +
    '</div>' +
    '<div style="flex:1">' +
      '<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:800;color:#888;letter-spacing:.15em;margin-bottom:3px">INVOICE#</div><div style="font-weight:700;font-size:13px">' + invNum + '</div></div>' +
      '<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:800;color:#888;letter-spacing:.15em;margin-bottom:3px">INVOICE DATE</div><div style="font-size:13px">' + invDate + '</div></div>' +
      '<div><div style="font-size:10px;font-weight:800;color:#888;letter-spacing:.15em;margin-bottom:3px">INVOICE DUE DATE</div><div style="font-size:13px">' + dueDate + '</div></div>' +
    '</div>' +
  '</div>' +
  '<table style="width:100%;border-collapse:collapse;margin-bottom:0">' +
    '<thead><tr style="background:#2a2a2a;color:#fff">' +
      '<th style="padding:10px 16px;text-align:left;font-size:12px">Description</th>' +
      '<th style="padding:10px 16px;text-align:center;font-size:12px">Qty</th>' +
      '<th style="padding:10px 16px;text-align:right;font-size:12px">Price</th>' +
      '<th style="padding:10px 16px;text-align:right;font-size:12px;background:#E86900">Total</th>' +
    '</tr></thead>' +
    '<tbody>' + (rows || '<tr><td colspan="4" style="padding:16px;text-align:center;color:#aaa">No line items</td></tr>') + '</tbody>' +
  '</table>' +
  '<div style="display:flex;justify-content:flex-end;margin-bottom:24px">' +
    '<div style="background:#2a2a2a;color:#fff;padding:11px 20px;font-weight:800;font-size:13px">Sub Total</div>' +
    '<div style="background:#E86900;color:#fff;padding:11px 20px;font-weight:800;font-size:13px;min-width:90px;text-align:right">$' + sub.toFixed(2) + '</div>' +
  '</div>' +
  (wo.invoiceNotes ? '<div style="background:#f5f5f5;border-left:4px solid #2a2a2a;padding:14px 18px;margin-bottom:16px"><div style="font-size:10px;font-weight:800;color:#333;letter-spacing:.15em;margin-bottom:8px">INVOICE NOTES</div><div style="font-size:13px;color:#444;line-height:1.7">' + wo.invoiceNotes + '</div></div>' : '') +
  '</div><div style="background:#E86900;height:8px"></div></body></html>';
}

// ── Main App ──────────────────────────────────────────────────────────────────
function FieldOps() {
  const [store, setStore] = useState(() => loadStore() || freshStore());
  const [view, setView] = useState("dashboard");
  const [activeId, setActiveId] = useState(null);
  const [filterStatus, setFilterStatus] = useState("All");
  const [toast, setToast] = useState(null);

  useEffect(() => { saveStore(store); }, [store]);

  const { workOrders, settings } = store;
  const activeWO = workOrders.find(w => w.id === activeId);

  const update = (fn) => setStore(prev => { const next = fn(prev); saveStore(next); return next; });

  const showToast = (msg, type = "success") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2800);
  };

  const saveWO = (wo) => {
    update(s => ({
      ...s,
      workOrders: s.workOrders.find(w => w.id === wo.id)
        ? s.workOrders.map(w => w.id === wo.id ? { ...wo, updatedAt: Date.now() } : w)
        : [{ ...wo, updatedAt: Date.now() }, ...s.workOrders],
    }));
  };

  const deleteWO = (id) => {
    update(s => ({ ...s, workOrders: s.workOrders.filter(w => w.id !== id) }));
    setView("list");
    showToast("Work order deleted");
  };

  const saveSettings = (s) => { update(prev => ({ ...prev, settings: s })); showToast("Settings saved"); };
  const openWO = (wo) => { setActiveId(wo.id); setView("detail"); };

  const filtered = workOrders
    .filter(w => filterStatus === "All" || w.status === filterStatus)
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  const stats = {
    open: workOrders.filter(w => w.status === "Open").length,
    inProgress: workOrders.filter(w => w.status === "In Progress").length,
    completed: workOrders.filter(w => w.status === "Completed").length,
    invoiced: workOrders.filter(w => w.status === "Invoiced").length,
    revenue: workOrders.filter(w => w.status === "Invoiced")
      .reduce((s, w) => s + (w.lineItems || []).reduce((si, i) => si + parseFloat(i.qty) * parseFloat(i.rate), 0), 0),
  };

  return (
    <div style={{ background: "#0A0F1A", minHeight: "100vh", color: "#E2E8F0", maxWidth: 480, margin: "0 auto", paddingBottom: 90 }}>

      {toast && (
        <div style={{ position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)", background: toast.type === "success" ? "#065F46" : "#7F1D1D", color: "#fff", padding: "10px 20px", borderRadius: 10, zIndex: 9999, fontSize: 14, fontWeight: 600, boxShadow: "0 4px 20px rgba(0,0,0,0.5)", maxWidth: 340, textAlign: "center" }}>
          {toast.msg}
        </div>
      )}

      <div style={{ background: "#0D1626", borderBottom: "1px solid #1E2D45", padding: "16px 20px 12px", position: "sticky", top: 0, zIndex: 100 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.15em", color: "#E86900" }}>FIELDOPS</div>
            <div style={{ fontSize: 17, fontWeight: 800, color: "#F0F6FF", lineHeight: 1.1 }}>{settings.companyName}</div>
          </div>
          <button onClick={() => setView("settings")} style={{ background: "none", border: "none", color: "#4A8FC1", fontSize: 22, cursor: "pointer", padding: 4 }}>⚙</button>
        </div>
      </div>

      <div style={{ padding: "16px 16px 0" }}>
        {view === "dashboard" && <Dashboard stats={stats} workOrders={workOrders} openWO={openWO} setView={setView} />}
        {view === "list"      && <WOList orders={filtered} openWO={openWO} filterStatus={filterStatus} setFilterStatus={setFilterStatus} />}
        {view === "new"       && <NewWO settings={settings} store={store} update={update} setView={setView} setActiveId={setActiveId} showToast={showToast} />}
        {view === "detail"    && activeWO && <WODetail wo={activeWO} settings={settings} saveWO={saveWO} deleteWO={deleteWO} setView={setView} showToast={showToast} />}
        {view === "invoice"   && activeWO && <InvoiceView wo={activeWO} settings={settings} saveWO={saveWO} update={update} setView={setView} showToast={showToast} />}
        {view === "settings"  && <SettingsView settings={settings} saveSettings={saveSettings} setView={setView} workOrders={workOrders} update={update} />}
      </div>

      <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 480, background: "#0D1626", borderTop: "1px solid #1E2D45", display: "flex", justifyContent: "space-around", alignItems: "center", padding: "8px 0 24px", zIndex: 200 }}>
        {[{ id: "dashboard", icon: "◈", label: "Dashboard" }, { id: "list", icon: "☰", label: "Orders" }, { id: "new", primary: true }].map(t => (
          <button key={t.id} onClick={() => setView(t.id)} style={{ background: t.primary ? "#E86900" : "none", border: "none", color: t.primary ? "#fff" : (view === t.id ? "#E86900" : "#556070"), display: "flex", flexDirection: "column", alignItems: "center", fontSize: t.primary ? 28 : 11, fontWeight: t.primary ? 400 : 600, cursor: "pointer", padding: t.primary ? 0 : "4px 24px", borderRadius: t.primary ? "50%" : 0, width: t.primary ? 52 : "auto", height: t.primary ? 52 : "auto", justifyContent: "center", marginTop: t.primary ? -16 : 0, boxShadow: t.primary ? "0 4px 16px rgba(232,105,0,0.5)" : "none", letterSpacing: "0.04em", textTransform: "uppercase" }}>
            {t.primary ? "+" : <><span style={{ fontSize: 18, marginBottom: 2 }}>{t.icon}</span>{t.label}</>}
          </button>
        ))}
      </div>
    </div>
  );
}

function Dashboard({ stats, workOrders, openWO, setView }) {
  const recent = [...workOrders].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 5);
  return (
    <div>
      <div style={{ fontSize: 12, color: "#6B7E96", fontWeight: 700, marginBottom: 10, letterSpacing: "0.08em" }}>OVERVIEW</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
        {[["Open", stats.open, "#7EBCF5"], ["In Progress", stats.inProgress, "#4ADE80"], ["Completed", stats.completed, "#A78BFA"], ["Invoiced", stats.invoiced, "#34D399"]].map(([l, v, c]) => (
          <div key={l} style={{ background: "#111827", borderRadius: 12, padding: "14px 16px", border: "1px solid #1E2D45" }}>
            <div style={{ fontSize: 28, fontWeight: 800, color: c, lineHeight: 1 }}>{v}</div>
            <div style={{ fontSize: 11, color: "#6B7E96", marginTop: 4, fontWeight: 600 }}>{l.toUpperCase()}</div>
          </div>
        ))}
      </div>
      <div style={{ background: "#1A1200", borderRadius: 12, padding: "14px 16px", border: "1px solid #3A2800", marginBottom: 20 }}>
        <div style={{ fontSize: 11, color: "#E86900", fontWeight: 700, letterSpacing: "0.1em" }}>INVOICED REVENUE</div>
        <div style={{ fontSize: 30, fontWeight: 800, color: "#FFA040", marginTop: 4 }}>${stats.revenue.toFixed(2)}</div>
      </div>
      {recent.length > 0 && (<>
        <div style={{ fontSize: 12, color: "#6B7E96", fontWeight: 700, marginBottom: 10 }}>RECENT</div>
        {recent.map(wo => <WOCard key={wo.id} wo={wo} onClick={() => openWO(wo)} />)}
        <Ghost onClick={() => setView("list")}>View All Work Orders →</Ghost>
      </>)}
      {workOrders.length === 0 && (
        <div style={{ textAlign: "center", padding: "48px 20px", color: "#4A5568" }}>
          <div style={{ fontSize: 44, marginBottom: 12 }}>📋</div>
          <div style={{ fontWeight: 700, fontSize: 16, color: "#6B7E96" }}>No work orders yet</div>
          <div style={{ fontSize: 13, marginTop: 6 }}>Tap + to create your first one</div>
        </div>
      )}
    </div>
  );
}

function WOCard({ wo, onClick }) {
  const hours = (wo.timeLogs || []).reduce((s, l) => s + parseFloat(l.hours || 0), 0);
  const techs = Array.isArray(wo.assignedTechs) ? wo.assignedTechs : [];
  return (
    <div onClick={onClick} style={{ background: "#111827", borderRadius: 12, padding: "14px 16px", marginBottom: 10, border: "1px solid #1E2D45", cursor: "pointer" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
        <div style={{ fontSize: 11, color: "#E86900", fontWeight: 700 }}>WO-{wo.id}</div>
        <Badge status={wo.status} />
      </div>
      <div style={{ fontWeight: 700, fontSize: 15, color: "#E2E8F0", marginBottom: 3 }}>{wo.clientName}</div>
      {wo.project && <div style={{ fontSize: 11, color: "#E86900", marginBottom: 3, fontWeight: 600 }}>{wo.project}</div>}
      <div style={{ fontSize: 12, color: "#6B7E96", marginBottom: 8 }}>{wo.workType} · {wo.location}</div>
      <div style={{ display: "flex", gap: 14, fontSize: 11, color: "#4A5568" }}>
        <span>👤 {techs.join(", ") || "Unassigned"}</span>
        <span>⏱ {hours.toFixed(1)}h</span>
        <span>💰 {(wo.lineItems || []).length} items</span>
      </div>
    </div>
  );
}

function WOList({ orders, openWO, filterStatus, setFilterStatus }) {
  return (
    <div>
      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 12, marginBottom: 8 }}>
        {["All", "Open", "In Progress", "On Hold", "Completed", "Invoiced"].map(s => (
          <button key={s} onClick={() => setFilterStatus(s)} style={{ background: filterStatus === s ? "#E86900" : "#111827", border: filterStatus === s ? "none" : "1px solid #1E2D45", color: filterStatus === s ? "#fff" : "#6B7E96", borderRadius: 20, padding: "6px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0 }}>{s}</button>
        ))}
      </div>

function TimeTab({ wo, techs, persist, showToast }) {
  const [tech, setTech] = useState(techs[0] || "");
  const [hours, setHours] = useState("");
  const [note, setNote] = useState("");
  const [date, setDate] = useState(todayStr());
  const [clockIn, setClockIn] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const timer = useRef(null);

  useEffect(() => {
    if (clockIn) { timer.current = setInterval(() => setElapsed(Date.now() - clockIn), 1000); }
    else { clearInterval(timer.current); }
    return () => clearInterval(timer.current);
  }, [clockIn]);

  const fmtE = (ms) => { const s = Math.floor(ms / 1000); return String(Math.floor(s/3600)).padStart(2,"0") + ":" + String(Math.floor((s%3600)/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); };
  const stopClock = () => { const h = parseFloat(((Date.now()-clockIn)/3600000).toFixed(2)); persist({ timeLogs: [...(wo.timeLogs||[]), {id:uid(),tech,hours:h,note:"Clock in/out",date}] }); setClockIn(null); showToast(h+"h logged for "+tech); };
  const addManual = () => { if (!hours||isNaN(hours)||parseFloat(hours)<=0) { showToast("Enter valid hours","error"); return; } persist({ timeLogs: [...(wo.timeLogs||[]), {id:uid(),tech,hours:parseFloat(hours),note,date}] }); setHours(""); setNote(""); showToast(hours+"h logged"); };
  const remove = (id) => persist({ timeLogs: (wo.timeLogs||[]).filter(l=>l.id!==id) });
  const total = (wo.timeLogs||[]).reduce((s,l)=>s+parseFloat(l.hours||0),0);

  return (
    <div>
      <Card style={{ background: clockIn ? "#0B2444" : "#111827", border: clockIn ? "1px solid #1A4A7A" : "1px solid #1E2D45", textAlign: "center" }}>
        <SL>STOPWATCH</SL>
        {clockIn ? <div style={{ fontSize: 36, fontWeight: 800, color: "#7EBCF5", marginBottom: 12, fontVariantNumeric: "tabular-nums", letterSpacing: 2 }}>{fmtE(elapsed)}</div>
                 : <div style={{ fontSize: 13, color: "#4A5568", marginBottom: 12 }}>Tap Clock In to start tracking on-site time</div>}
        <Sel value={tech} options={techs} onChange={setTech} />
        <button onClick={clockIn ? stopClock : ()=>setClockIn(Date.now())} style={{ width:"100%",padding:14,borderRadius:10,border:"none",fontWeight:800,fontSize:15,cursor:"pointer",background:clockIn?"#7F1D1D":"#065F46",color:clockIn?"#FCA5A5":"#6EE7B7",marginTop:8 }}>
          {clockIn ? "⏹ Clock Out & Save" : "⏱ Clock In"}
        </button>
      </Card>
      <Card><SL>MANUAL ENTRY</SL>
        <Sel value={tech} options={techs} onChange={setTech} />
        <F label="Hours" value={hours} onChange={setHours} placeholder="e.g. 2.5" type="number" />
        <F label="Date" value={date} onChange={setDate} type="date" />
        <F label="Notes" value={note} onChange={setNote} placeholder="What was done?" />
        <Btn onClick={addManual} color="#E86900">Add Time Entry</Btn>
      </Card>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#E86900", marginBottom: 10 }}>LOG · TOTAL: {total.toFixed(2)}h</div>
      {(wo.timeLogs||[]).length===0 && <div style={{ textAlign:"center",color:"#4A5568",fontSize:13,padding:20 }}>No time logged yet</div>}
      {[...(wo.timeLogs||[])].reverse().map(log => (
        <div key={log.id} style={{ background:"#111827",borderRadius:10,padding:"12px 14px",marginBottom:8,border:"1px solid #1E2D45",display:"flex",justifyContent:"space-between",alignItems:"center" }}>
          <div>
            <div style={{ fontWeight:700,fontSize:14 }}>{log.tech} · <span style={{ color:"#FFA040" }}>{log.hours}h</span></div>
            <div style={{ fontSize:12,color:"#4A5568" }}>{fmtDate(log.date)}{log.note ? " · "+log.note : ""}</div>
          </div>
          <button onClick={()=>remove(log.id)} style={{ background:"none",border:"none",color:"#4A5568",cursor:"pointer",fontSize:22,padding:"0 4px" }}>×</button>
        </div>
      ))}
    </div>
  );
}

              <th style={{ padding:"8px 10px",textAlign:"right",background:"#E86900" }}>Total</th>
            </tr></thead>
            <tbody>
              {items.length===0 && <tr><td colSpan={4} style={{ padding:12,textAlign:"center",color:"#aaa" }}>No line items</td></tr>}
              {items.map((item,i) => (
                <tr key={item.id} style={{ background:i%2===0?"#fff":"#fafafa" }}>
                  <td style={{ padding:"7px 10px" }}>{item.desc}</td>
                  <td style={{ padding:"7px 10px",textAlign:"center",color:"#555" }}>{item.qty}</td>
                  <td style={{ padding:"7px 10px",textAlign:"right",color:"#555" }}>{fmt$(item.rate)}</td>
                  <td style={{ padding:"7px 10px",textAlign:"right",fontWeight:700,background:"#E8690015" }}>{fmt$(item.qty*item.rate)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ display:"flex",justifyContent:"flex-end",marginBottom:12 }}>
            <div style={{ background:"#2a2a2a",color:"#fff",padding:"8px 14px",fontWeight:800,fontSize:12 }}>Sub Total</div>
            <div style={{ background:"#E86900",color:"#fff",padding:"8px 14px",fontWeight:800,fontSize:12,minWidth:70,textAlign:"right" }}>{fmt$(sub)}</div>
          </div>
          {invoiceNotes && (
            <div style={{ background:"#f5f5f5",borderLeft:"3px solid #2a2a2a",padding:"10px 12px" }}>
              <div style={{ fontSize:9,fontWeight:800,color:"#333",letterSpacing:"0.12em",marginBottom:5 }}>INVOICE NOTES</div>
              <div style={{ fontSize:11,color:"#444",lineHeight:1.6 }}>{invoiceNotes}</div>
            </div>
          )}
        </div>
        <div style={{ background:"#E86900",height:8 }} />
      </div>

      <Btn onClick={printInvoice} color="#1A6FC4">🖨 Print / Save as PDF</Btn>
      <Btn onClick={markInvoiced} color="#065F46">✓ Mark as Invoiced</Btn>
    </div>
  );
}

function SettingsView({ settings, saveSettings, setView, workOrders, update }) {
  const [form, setForm] = useState({ ...settings, techs: [...settings.techs], workTypes: [...settings.workTypes] });
  const [newTech, setNewTech] = useState("");
  const [newType, setNewType] = useState("");
  const set = (k, v) => setForm(p => ({ ...p, [k]: v }));
  const addTech = () => { if (!newTech.trim()) return; setForm(p => ({ ...p, techs: [...p.techs, newTech.trim()] })); setNewTech(""); };
  const rmTech  = (t) => setForm(p => ({ ...p, techs: p.techs.filter(x => x !== t) }));
  const addType = () => { if (!newType.trim()) return; setForm(p => ({ ...p, workTypes: [...p.workTypes, newType.trim()] })); setNewType(""); };
  const rmType  = (t) => setForm(p => ({ ...p, workTypes: p.workTypes.filter(x => x !== t) }));

  const exportData = () => {
    try {
      const data = JSON.stringify({ workOrders, settings: form }, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "fieldops-backup.json"; a.click();
      URL.revokeObjectURL(url);
    } catch(e) { alert("Export failed: " + e.message); }
  };

  const importData = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.workOrders && data.settings) {
          update(s => ({ ...s, workOrders: data.workOrders, settings: data.settings }));
          setForm({ ...data.settings, techs: [...data.settings.techs], workTypes: [...data.settings.workTypes] });
          alert("Import successful! " + data.workOrders.length + " work orders loaded.");
        } else { alert("Invalid backup file."); }
      } catch { alert("Could not read file."); }
    };
    reader.readAsText(file);
  };

  return (
    <div>
      <div style={{ display:"flex",alignItems:"center",gap:12,marginBottom:20 }}>
        <button onClick={() => setView("dashboard")} style={{ background:"none",border:"none",color:"#4A8FC1",fontSize:22,cursor:"pointer" }}>←</button>
        <div style={{ fontSize:18,fontWeight:800 }}>Settings</div>
      </div>
      <Card><SL>COMPANY INFO</SL>
        <F label="Company Name" value={form.companyName} onChange={v => set("companyName", v)} />
        <F label="Address" value={form.companyAddress} onChange={v => set("companyAddress", v)} />
        <F label="Phone" value={form.companyPhone} onChange={v => set("companyPhone", v)} type="tel" />
        <F label="Email" value={form.companyEmail} onChange={v => set("companyEmail", v)} type="email" />
        <F label="Last Invoice # (next will be +1)" value={String(form.invoiceSeq)} onChange={v => set("invoiceSeq", parseInt(v) || 0)} type="number" />
        <Btn onClick={() => saveSettings(form)} color="#E86900">Save Company Info</Btn>
      </Card>
      <Card><SL>TECHNICIANS</SL>
        {form.techs.map(t => (
          <div key={t} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #1A2333" }}>
            <span style={{ fontSize:14,color:"#C2D3E8" }}>{t}</span>
            <button onClick={() => rmTech(t)} style={{ background:"none",border:"none",color:"#4A5568",cursor:"pointer",fontSize:22 }}>×</button>
          </div>
        ))}
        <div style={{ display:"flex",gap:8,marginTop:10 }}>
          <input value={newTech} onChange={e => setNewTech(e.target.value)} placeholder="Add technician" onKeyDown={e => e.key==="Enter" && addTech()} style={{ flex:1,...INP }} />
          <button onClick={addTech} style={{ padding:"0 16px",background:"#E86900",border:"none",borderRadius:10,color:"#fff",fontWeight:800,cursor:"pointer" }}>+</button>
        </div>
        <div style={{ marginTop:10 }}><Btn onClick={() => saveSettings(form)} color="#E86900">Save Technicians</Btn></div>
      </Card>
      <Card><SL>WORK TYPES</SL>
        {form.workTypes.map(t => (
          <div key={t} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #1A2333" }}>
            <span style={{ fontSize:13,color:"#C2D3E8" }}>{t}</span>
            <button onClick={() => rmType(t)} style={{ background:"none",border:"none",color:"#4A5568",cursor:"pointer",fontSize:22 }}>×</button>
          </div>
        ))}
        <div style={{ display:"flex",gap:8,marginTop:10 }}>
          <input value={newType} onChange={e => setNewType(e.target.value)} placeholder="Add work type" onKeyDown={e => e.key==="Enter" && addType()} style={{ flex:1,...INP }} />
          <button onClick={addType} style={{ padding:"0 16px",background:"#E86900",border:"none",borderRadius:10,color:"#fff",fontWeight:800,cursor:"pointer" }}>+</button>
        </div>
        <div style={{ marginTop:10 }}><Btn onClick={() => saveSettings(form)} color="#E86900">Save Work Types</Btn></div>
      </Card>
      <Card style={{ background:"#0B1A2E",border:"1px solid #1A3A5C" }}><SL>BACKUP &amp; RESTORE</SL>
        <div style={{ fontSize:12,color:"#6B7E96",marginBottom:12,lineHeight:1.6 }}>
          {workOrders.length} work orders on this device. Export regularly as a backup.
        </div>
        <Ghost onClick={exportData}>📥 Export Backup (JSON)</Ghost>
        <label style={{ display:"block",width:"100%",padding:12,background:"#1A2333",border:"1px solid #1E2D45",borderRadius:10,color:"#7EBCF5",fontWeight:700,fontSize:13,cursor:"pointer",marginBottom:10,textAlign:"center",boxSizing:"border-box" }}>
          📤 Import Backup (JSON)
          <input type="file" accept=".json" onChange={importData} style={{ display:"none" }} />
        </label>
      </Card>
    </div>
  );
}

// Register service worker & generate icons
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(e => console.log("SW:", e));
  });
}

// Generate app icons via canvas and inject as link tags
(function generateIcons() {
  [192, 512].forEach(size => {
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    // Background
    ctx.fillStyle = "#0A0F1A";
    ctx.fillRect(0, 0, size, size);
    // Orange accent bar top
    ctx.fillStyle = "#E86900";
    ctx.fillRect(0, 0, size, size * 0.08);
    // DL initials
    ctx.fillStyle = "#E86900";
    ctx.font = "bold " + Math.floor(size * 0.42) + "px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("DL", size / 2, size / 2 + size * 0.04);
    // Bottom bar
    ctx.fillStyle = "#E86900";
    ctx.fillRect(0, size * 0.92, size, size * 0.08);
    // Save as PNG
    const img = canvas.toDataURL("image/png");
    const link = document.createElement("link");
    link.rel = "apple-touch-icon";
    link.setAttribute("sizes", size + "x" + size);
    link.href = img;
    document.head.appendChild(link);
    // Also save as named file reference in manifest
    if (size === 192) {
      document.querySelector('link[rel="apple-touch-icon"][href="icon-192.png"]') && 
        document.querySelector('link[rel="apple-touch-icon"][href="icon-192.png"]').remove();
    }
  });
})();

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(FieldOps));
